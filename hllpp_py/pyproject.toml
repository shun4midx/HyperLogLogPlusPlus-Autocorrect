[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "hllpp"
version = "0.0.3"
authors = [
  { name="Shun/修海", email="shun4midx@gmail.com" },
]
description = "A HyperLogLog++ Autocorrection algorithm that is also dyslexia-friendly."
readme = "Library.md"
requires-python = ">=3.9"
classifiers = [
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = ["LICENSE"]

dependencies = [
  "bitarray>=3.5.1"
]

[project.urls]
Homepage = "https://github.com/shun4midx/HLL-PlusPlus-Autocorrect"
Issues = "https://github.com/shun4midx/HLL-PlusPlus-Autocorrect/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hllpp"]

[tool.hatch.build]
include = [
    "src/hllpp/**",
    "LICENSE",
    "Library.md"
]
exclude = [
    "tests/**",
]